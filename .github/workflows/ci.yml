name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  health-check:
    name: Health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt || echo "::warning::tools/requirements.txt not found or has issue — continuing with core deps"

      - name: Compile-check all Python
        run: |
          python -m py_compile scripts/*.py
          python -m py_compile -m scripts.evidence_pack 2>/dev/null || true
          find scripts -name '*.py' -exec python -m py_compile {} +

  evidence-loop-test:
    name: Evidence loop (anti-hallucination) smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run evidence loop with mock data
        run: |
          echo "SQLi found at /api/login" | python -m scripts.evidence_pack.cli harvest \
            --tag CI01 --target "mock://ci" --claim "SQLi found at /api/login" \
            --source-cmd "echo mock"
          python scripts/health-check.py --json 2>/dev/null \
            || python scripts/health-check.py \
            || echo "::warning::health-check produced non-zero exit"

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/ -q

  yaml-lint:
    name: YAML config sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML files parse
        run: |
          pip install pyyaml -q
          python - <<'PY'
          import yaml, glob, sys
          ok = True
          for f in glob.glob('config/*.yaml') + glob.glob('config/*.yml') + glob.glob('memory/templates/*.yaml'):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  print(f'FAIL {f}: {e}'); ok = False
          print('OK' if ok else 'ERRORS')
          sys.exit(0 if ok else 1)
          PY

  tool-table-sync:
    name: Tool table sync (manifest ↔ README)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check tool tables are in sync
        run: |
          python scripts/gen-tool-table.py --dry-run
          if python scripts/gen-tool-table.py --dry-run | grep -q "DRY-RUN"; then
            echo "::error::README tool tables are out of sync with config/tools-manifest.json. Run: python scripts/gen-tool-table.py"
            exit 1
          fi
          echo "Tool tables are up to date."

  manifest-asset-check:
    name: Manifest asset-pattern check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate manifest asset patterns against real releases
        run: |
          python scripts/validate-manifest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}